version: '3.8'

services:

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    env_file: .env
    environment:
      - PORT=3000
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      - cluster-manager
    networks:
      - cache-network
    restart: on-failure

  cluster-manager:
    build: ./cluster-manager
    container_name: cluster-manager
    ports:
      - '${CLUSTER_MANAGER_PORT:-8082}:8082'
    env_file: .env
    environment:
      - PORT=8082
    networks:
      - cache-network
    restart: on-failure

  cache-node-a:
    build: ./cache-node
    container_name: cache-node-a
    ports:
      - '5001:5001'
    env_file: .env
    environment:
      - PORT=5001
      - NODE_ID=node-a
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      - cluster-manager
    networks:
      - cache-network
    restart: on-failure

  cache-node-b:
    build: ./cache-node
    container_name: cache-node-b
    ports:
      - '5002:5002'
    env_file: .env
    environment:
      - PORT=5002
      - NODE_ID=node-b
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      - cluster-manager
    networks:
      - cache-network
    restart: on-failure

  cache-node-c:
    build: ./cache-node
    container_name: cache-node-c
    ports:
      - '5003:5003'
    env_file: .env
    environment:
      - PORT=5003
      - NODE_ID=node-c
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      - cluster-manager
    networks:
      - cache-network
    restart: on-failure

  cache-node-d:
    build: ./cache-node
    container_name: cache-node-d
    ports:
      - '5004:5004'
    env_file: .env
    environment:
      - PORT=5004
      - NODE_ID=node-d
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      - cluster-manager
    networks:
      - cache-network
    restart: on-failure

  prometheus:
    build: ./prometheus
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus
    networks:
      - cache-network
    restart: on-failure

  grafana:
    build: ./grafana
    container_name: grafana
    ports:
      - '3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cache-network
    restart: on-failure

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway
    networks:
      - cache-network
    restart: on-failure

networks:
  cache-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
