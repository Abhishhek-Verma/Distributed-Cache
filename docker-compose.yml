version: '3.8'

services:

  gateway:
    # Image versioning for production deployments
    image: distributed-cache/gateway:v1
    build: ./gateway
    container_name: gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    env_file: .env
    environment:
      - PORT=3000
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      # Wait for cluster-manager to become fully healthy before starting
      cluster-manager:
        condition: service_healthy
    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Logging configuration to prevent unlimited log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (Commented Example)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://gateway:3000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - cache-network
    restart: unless-stopped

  cluster-manager:
    # Image versioning for production deployments
    image: distributed-cache/cluster-manager:v1
    build: ./cluster-manager
    container_name: cluster-manager
    ports:
      - '${CLUSTER_MANAGER_PORT:-8082}:8082'
    env_file: .env
    environment:
      - PORT=8082
    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Logging configuration to prevent unlimited log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (Commented Example)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  cache-node-a:
