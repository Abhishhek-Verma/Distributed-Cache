      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      # Wait for cluster-manager to become fully healthy before starting
      cluster-manager:
        condition: service_healthy
    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Logging configuration to prevent unlimited log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (Commented Example)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  cache-node-d:
    # Image versioning for production deployments
    image: distributed-cache/cache-node:v1
    build: ./cache-node
    container_name: cache-node-d
    ports:
      - '${CACHE_NODE_D_PORT:-5004}:5004'
    env_file: .env
    environment:
      - PORT=5004
      - NODE_ID=node-d
      - CLUSTER_MANAGER_URL=http://cluster-manager:8082
    depends_on:
      # Wait for cluster-manager to become fully healthy before starting
      cluster-manager:
        condition: service_healthy
    networks:
