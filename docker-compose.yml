    #       memory: 512M

  prometheus:
    # Image versioning for production deployments
    image: distributed-cache/prometheus:v1
    build: ./prometheus
    container_name: prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Logging configuration to prevent unlimited log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (Commented Example)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  grafana:
    # Image versioning for production deployments
    image: distributed-cache/grafana:v1
    build: ./grafana
    container_name: grafana
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Logging configuration to prevent unlimited log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (Commented Example)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M


# Internal networking ensuring isolated communication
networks:
  cache-network:
    driver: bridge

# Persistent named volumes
volumes:
  prometheus_data:
  grafana_data:
