    networks:
      - cache-network
    restart: unless-stopped
    # Health checks to ensure the service is running and responsive
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
